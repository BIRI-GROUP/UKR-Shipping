name: Portal access release
on:
  push:
    branches: ['release/portal-access-2026-10-04', 'fix/username-demo-login-2026-10-04', 'main']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ukr_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: ukr_release_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ukr_test -d ukr_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      AUTH_TEST_MODE: 'true'
      TEST_DATABASE_URL: postgres://ukr_test:isolated_ci_only@127.0.0.1:5432/ukr_release_test
    steps:
      - uses: actions/checkout@v4
      - name: Archive checked-out source
        run: git archive --format=zip --output=ukr-login-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ukr-login-source
          path: ukr-login-source.zip
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix services/staff --ignore-scripts
      - run: npm install --prefix tests/browser --ignore-scripts
      - run: node --test tests/staff.test.mjs tests/commerce.test.mjs tests/route-commerce.test.mjs tests/booking-lab.test.mjs
      - run: node --test --test-concurrency=1 tests/phase1/*.test.mjs tests/phase2/*.test.mjs
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/browser/phase1.mjs
      - name: Test username login in disposable PostgreSQL and Chromium
        run: UKR_DEMO_BROWSER_MODE=local node tests/browser/live-portals.mjs
      - name: Check actual published portal URLs and demonstration sign-in
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: node tests/browser/live-portals.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-release-evidence
          path: tests/evidence/
          retention-days: 7
