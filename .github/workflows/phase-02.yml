name: UKR Phase 2
on:
  push:
    branches: ['phase/02-shared-jobs-2026-10-04']
  pull_request:
    branches: ['phase/01-foundation-2026-10-04']
permissions:
  contents: read
concurrency:
  group: phase2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ukr_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: ukr_phase2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ukr_test -d ukr_phase2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      AUTH_TEST_MODE: 'true'
      TEST_DATABASE_URL: postgres://ukr_test:isolated_ci_only@127.0.0.1:5432/ukr_phase2_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing dependencies
        run: |
          npm install --prefix services/staff --ignore-scripts
          npm install --prefix tests/browser --ignore-scripts
      - name: Isolated runtime for reproducible offline development
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p runtime/lib runtime/node_modules runtime/browser
          cp "$(command -v node)" runtime/node
          cp -a services/staff/node_modules/. runtime/node_modules/
          cp -a tests/browser/node_modules/. runtime/browser/
          docker cp "$PG_CONTAINER:/usr/lib/postgresql/18" runtime/postgres
          docker cp "$PG_CONTAINER:/usr/share/postgresql/18" runtime/share-postgres
          for lib in $(docker exec "$PG_CONTAINER" sh -c 'ldd /usr/lib/postgresql/18/bin/postgres /usr/lib/postgresql/18/bin/initdb /usr/lib/postgresql/18/bin/psql /usr/lib/postgresql/18/bin/pg_dump' | awk '/=>/ {for(i=1;i<=NF;i++) if($i ~ /^\//)print $i}' | sort -u); do
            docker cp -L "$PG_CONTAINER:$lib" runtime/lib/
          done
          tar -czf ukr-phase2-runtime.tar.gz runtime
      - uses: actions/upload-artifact@v4
        with:
          name: ukr-phase2-runtime
          path: ukr-phase2-runtime.tar.gz
          retention-days: 1
      - name: Phase 2 SQL and workflow tests
        if: hashFiles('tests/phase2/*.test.mjs') != ''
        run: node --test --test-concurrency=1 tests/phase2/*.test.mjs
      - name: Install Chromium
        if: hashFiles('tests/browser/phase2.mjs') != ''
        run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Authenticated staff to customer journey
        if: hashFiles('tests/browser/phase2.mjs') != ''
        run: node tests/browser/phase2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ukr-phase2-test-results
          path: tests/evidence/phase2/
          retention-days: 7
      - name: Archive exact tested source
        if: always()
        run: git archive --format=zip --output=ukr-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ukr-phase2-source
          path: ukr-source.zip
          retention-days: 3
