name: Private portal review
on:
  push:
    branches: ['release/private-review-1234-2026-10-04']
  pull_request:
    branches: ['main']
permissions:
  contents: read
concurrency:
  group: private-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ukr_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: ukr_review_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ukr_test -d ukr_review_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      AUTH_TEST_MODE: 'true'
      TEST_DATABASE_URL: postgres://ukr_test:isolated_ci_only@127.0.0.1:5432/ukr_review_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix services/staff --ignore-scripts
      - run: npm install --prefix tests/browser --ignore-scripts
      - name: Existing authentication and database regression tests
        run: node --test --test-concurrency=1 tests/phase1/*.test.mjs tests/phase2/*.test.mjs
      - name: Private review HTTP and PostgreSQL access boundaries
        run: node --test tests/review.test.mjs tests/review-ui.test.mjs
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Existing authenticated portal browser suite
        run: node tests/browser/phase1.mjs
      - name: Private entry page browser checks
        run: node tests/browser/review-pages.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-review-evidence
          path: tests/evidence/
          retention-days: 7
